services:

  # ── PostgreSQL ────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: rfq-postgres
    environment:
      POSTGRES_DB:       rfq_db
      POSTGRES_USER:     rfq_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rfq_user -d rfq_db"]
      interval: 5s
      timeout: 3s
      retries: 15
    restart: unless-stopped

  # ── Node.js backend ───────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rfq-backend
    environment:
      PORT:               "3001"
      DATABASE_URL:       postgresql://rfq_user:${POSTGRES_PASSWORD:-changeme}@postgres:5432/rfq_db
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      OPENROUTER_MODEL:   ${OPENROUTER_MODEL:-nousresearch/hermes-3-llama-3-8b}
      FRONTEND_ORIGIN:    http://localhost:${PORT:-8080}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # ── React frontend (Nginx) ────────────────────────────────────────
  frontend:
    build:
      context: ./dashboard-app
      dockerfile: Dockerfile
    container_name: rfq-dashboard
    ports:
      - "${PORT:-8080}:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
