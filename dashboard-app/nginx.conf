server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # gzip text assets
  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # Long-cache hashed bundle assets
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # .eml examples served as text
  location /example-mails/ {
    default_type text/plain;
    try_files $uri =404;
  }

  # Proxy API calls to backend (includes SSE streaming).
  #
  # We deliberately resolve the backend hostname at REQUEST time via Docker's
  # embedded DNS (127.0.0.11) and a variable proxy_pass, instead of at startup.
  # With a literal `proxy_pass http://rfq-backend:3001`, nginx resolves the name
  # when it boots and REFUSES TO START ("host not found in upstream") if the
  # backend container isn't up yet — which crash-loops the whole dashboard when
  # the frontend is run on its own (e.g. a bare `docker run` without the agent
  # backend). Deferring resolution lets the dashboard boot regardless; if the
  # backend is genuinely absent, /api calls simply return 502 and the rest of
  # the app keeps working.
  location /api/ {
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $agent_backend "http://rfq-backend:3001";
    proxy_pass         $agent_backend;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   Connection        '';

    # SSE / streaming — disable all buffering
    proxy_buffering    off;
    proxy_cache        off;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    chunked_transfer_encoding on;
  }

  # SPA fallback — all client routes resolve to index.html
  location / {
    try_files $uri $uri/ /index.html;
  }
}
