<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RFQ Live Dashboard</title>
    <style>
      /* ── Base (dark) theme ────────────────────────────────────── */
      :root {
        --bg:       #0f172a; --surface:  #1e293b; --surface2: #263147;
        --surface3: #2d3a52; --border:   #334155; --accent:   #38bdf8;
        --green:    #34d399; --red:       #f87171; --amber:    #fbbf24;
        --pink:     #f472b6; --text:      #e2e8f0; --text2:    #94a3b8;
        --text3:    #64748b;
      }
      /* ── Light theme ──────────────────────────────────────────── */
      [data-theme="light"] {
        --bg:       #f1f5f9; --surface:  #ffffff; --surface2: #f8fafc;
        --surface3: #e2e8f0; --border:   #cbd5e1; --accent:   #0284c7;
        --green:    #16a34a; --red:       #dc2626; --amber:    #d97706;
        --pink:     #db2777; --text:      #0f172a; --text2:    #475569;
        --text3:    #94a3b8;
      }
      /* ── Cyberpunk theme ──────────────────────────────────────── */
      [data-theme="cyberpunk"] {
        --bg:       #000510; --surface:  #050d1f; --surface2: #0a1528;
        --surface3: #0f1e35; --border:   #1a2e4a; --accent:   #00ffe5;
        --green:    #00ff9f; --red:       #ff2d55; --amber:    #ffcc00;
        --pink:     #ff00aa; --text:      #d0f0ff; --text2:    #7ab8d0;
        --text3:    #3a6a80;
      }
      html, body, #root { height: 100%; margin: 0; background: var(--bg); color: var(--text); font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; transition: background 0.3s, color 0.3s; }
      @keyframes slideIn { from { opacity:0; transform:translateY(6px); } to { opacity:1; transform:translateY(0); } }
      @keyframes pulse   { 0%,100% { opacity:0.4; } 50% { opacity:1; } }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
